# Render Blueprint: Sanctio + the SwiftShip demo business + PostgreSQL, all on Render's free plans.
# Free web services sleep after 15 minutes without traffic and take about a minute to wake; the free
# database is deleted 30 days after it is created. See "Deploy for a live demo" in README.md.
# Render dashboard -> New -> Blueprint -> pick this repository. Values marked `sync: false`
# are asked for when the Blueprint is created; see "Deploy for a live demo" in README.md.
envVarGroups:
  - name: swiftship-demo-shared        # credentials shared by Sanctio (seed script) and the demo business
    envVars:
      - key: DEMO_API_KEY
        generateValue: true
      - key: DEMO_WEBHOOK_SECRET
        generateValue: true
      - key: DEMO_RESET_TOKEN
        generateValue: true

databases:
  - name: sanctio-db
    plan: free                         # deleted 30 days after creation; or use a free Neon database (README)
    databaseName: sanctio
    user: sanctio

services:
  - type: web
    name: sanctio
    runtime: docker
    plan: free                         # sleeps after 15 idle minutes; wakes in about a minute
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sanctio-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ALLOW_PRIVATE_WEBHOOK_URLS
        value: "0"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY              # free backup AI (console.groq.com); answers when Gemini is busy
        sync: false
      - key: GEMINI_MODEL              # change here if Google retires the model (Setup -> Test AI shows it)
        value: gemini-3.8-flash
      - key: DEMO_BUSINESS_URL         # e.g. https://swiftship-demo.onrender.com
        sync: false
      - key: DEMO_ADMIN_EMAIL
        value: demo@swiftship.test
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_CUSTOMER_PHONES      # optional, e.g. C-1001=+2348030000001
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - fromGroup: swiftship-demo-shared

  - type: web
    name: swiftship-demo
    runtime: python
    plan: free
    rootDir: demo_business
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SANCTIO_URL               # e.g. https://sanctio.onrender.com
        sync: false
      - key: DEMO_CUSTOMER_PHONES      # same value as on the sanctio service
        sync: false
      - fromGroup: swiftship-demo-shared
